name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "${unformatted}" ]; then
            echo "gofmt needed for:"
            echo "${unformatted}"
            exit 1
          fi

      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Scanned with the current Go rather than the minimum from go.mod: an
      # old toolchain reports its own patched-since standard library, which
      # says nothing about this code.
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, lint]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Start SSH agent for Homebrew tap
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}

      - name: Update Homebrew tap
        env:
          TAP_REPOSITORY: git@github.com:LinDevHard/homebrew-tap.git
          TAP_DIR: /tmp/homebrew-tap
          FORMULA_PATH: Formula/wadb.rb
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          VERSION="${TAG#v}"
          CHECKSUMS_FILE="dist/checksums.txt"
          checksum() {
            awk -v file="$1" '$2 == file { print $1 }' "${CHECKSUMS_FILE}"
          }

          DARWIN_AMD64_SHA256="$(checksum "wadb-${VERSION}-darwin-amd64.tar.gz")"
          DARWIN_ARM64_SHA256="$(checksum "wadb-${VERSION}-darwin-arm64.tar.gz")"
          LINUX_AMD64_SHA256="$(checksum "wadb-${VERSION}-linux-amd64.tar.gz")"
          LINUX_ARM64_SHA256="$(checksum "wadb-${VERSION}-linux-arm64.tar.gz")"

          for value in \
            "${DARWIN_AMD64_SHA256}" \
            "${DARWIN_ARM64_SHA256}" \
            "${LINUX_AMD64_SHA256}" \
            "${LINUX_ARM64_SHA256}"; do
            test -n "${value}"
          done

          mkdir -p ~/.ssh
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          git clone "${TAP_REPOSITORY}" "${TAP_DIR}"
          mkdir -p "${TAP_DIR}/Formula"
          sed \
            -e "s/{{TAG}}/${TAG}/g" \
            -e "s/{{VERSION}}/${VERSION}/g" \
            -e "s/{{DARWIN_AMD64_SHA256}}/${DARWIN_AMD64_SHA256}/g" \
            -e "s/{{DARWIN_ARM64_SHA256}}/${DARWIN_ARM64_SHA256}/g" \
            -e "s/{{LINUX_AMD64_SHA256}}/${LINUX_AMD64_SHA256}/g" \
            -e "s/{{LINUX_ARM64_SHA256}}/${LINUX_ARM64_SHA256}/g" \
            packaging/homebrew/wadb.rb.template > "${TAP_DIR}/${FORMULA_PATH}"
          cd "${TAP_DIR}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${FORMULA_PATH}"
          if git diff --cached --quiet; then
            echo "Homebrew formula is already up to date."
          else
            git commit -m "Update wadb formula to ${VERSION}"
            git push origin HEAD:main
          fi
