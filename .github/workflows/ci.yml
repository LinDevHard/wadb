name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race ./...

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Start SSH agent for Homebrew tap
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}

      - name: Update Homebrew tap
        env:
          TAP_REPOSITORY: git@github.com:LinDevHard/homebrew-tap.git
          TAP_DIR: /tmp/homebrew-tap
          FORMULA_PATH: Formula/wadb.rb
          VERSION: ${{ github.ref_name }}
          REVISION: ${{ github.sha }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          git clone "${TAP_REPOSITORY}" "${TAP_DIR}"
          mkdir -p "${TAP_DIR}/Formula"
          sed \
            -e "s/{{TAG}}/${VERSION}/g" \
            -e "s/{{REVISION}}/${REVISION}/g" \
            packaging/homebrew/wadb.rb.template > "${TAP_DIR}/${FORMULA_PATH}"
          cd "${TAP_DIR}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${FORMULA_PATH}"
          if git diff --cached --quiet; then
            echo "Homebrew formula is already up to date."
          else
            git commit -m "Update wadb formula to ${VERSION}"
            git push origin HEAD:main
          fi
